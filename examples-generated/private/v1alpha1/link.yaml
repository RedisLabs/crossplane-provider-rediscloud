apiVersion: private.redis.io/v1alpha1
kind: Link
metadata:
  annotations:
    meta.upbound.io/example-id: private/v1alpha1/link
  labels:
    testing.upbound.io/example-name: private_link
  name: private-link
spec:
  forProvider:
    principal:
    - principal: "123456789012"
      principalAlias: principal 1
      principalType: aws_account
    - principal: "123456789013"
      principalAlias: principal 2
      principalType: aws_account
    shareName: ${local.rediscloud_private_link_share_name}
    subscriptionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: subscription

---

apiVersion: rediscloud.redis.io/v1alpha1
kind: Subscription
metadata:
  annotations:
    meta.upbound.io/example-id: private/v1alpha1/link
  labels:
    testing.upbound.io/example-name: subscription
  name: subscription
spec:
  forProvider:
    cloudProvider:
    - cloudAccountId: ${data.rediscloud_cloud_account.account.id}
      provider: ${data.rediscloud_cloud_account.account.provider_type}
      region:
      - networkingDeploymentCidr: 10.0.0.0/24
        preferredAvailabilityZones:
        - euw1-az1
        region: eu-west-1
    creationPlan:
    - datasetSizeInGb: 15
      quantity: 1
      replication: true
      throughputMeasurementBy: operations-per-second
      throughputMeasurementValue: 20000
    name: ${local.rediscloud_subscription_name}
    paymentMethodId: ${data.rediscloud_payment_method.card.id}

---

apiVersion: subscription.redis.io/v1alpha1
kind: Database
metadata:
  annotations:
    meta.upbound.io/example-id: private/v1alpha1/link
  labels:
    testing.upbound.io/example-name: database
  name: database
spec:
  forProvider:
    dataPersistence: aof-every-1-second
    datasetSizeInGb: 15
    name: my-database
    replication: true
    subscriptionId: ${rediscloud_subscription.subscription.id}
    throughputMeasurementBy: operations-per-second
    throughputMeasurementValue: 20000

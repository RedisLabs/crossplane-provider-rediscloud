apiVersion: active.redis.io/v1beta1
kind: ActivePrivateLink
metadata:
  annotations:
    meta.upbound.io/example-id: active/v1beta1/activeprivatelink
  labels:
    testing.upbound.io/example-name: private_link
  name: private-link
spec:
  forProvider:
    principal:
    - principal: "123456789012"
      principalAlias: principal 1
      principalType: aws_account
    - principal: "234567890123"
      principalAlias: principal 2
      principalType: aws_account
    regionId: ${data.rediscloud_active_active_subscription_regions.aa_regions_info.regions[0].region_id}
    shareName: ${local.rediscloud_private_link_share_name}
    subscriptionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: aa_subscription

---

apiVersion: active.redis.io/v1beta1
kind: ActiveSubscription
metadata:
  annotations:
    meta.upbound.io/example-id: active/v1beta1/activeprivatelink
  labels:
    testing.upbound.io/example-name: aa_subscription
  name: aa-subscription
spec:
  forProvider:
    cloudProvider: AWS
    creationPlan:
    - memoryLimitInGb: 1
      quantity: 1
      region:
      - networkingDeploymentCidr: 192.168.0.0/24
        readOperationsPerSecond: 1000
        region: eu-west-1
        writeOperationsPerSecond: 1000
      - networkingDeploymentCidr: 10.0.1.0/24
        readOperationsPerSecond: 1000
        region: eu-west-2
        writeOperationsPerSecond: 1000
    name: ${local.rediscloud_subscription_name}
    paymentMethod: credit-card
    paymentMethodId: ${data.rediscloud_payment_method.card.id}

---

apiVersion: active.redis.io/v1beta1
kind: ActiveSubscriptionDatabase
metadata:
  annotations:
    meta.upbound.io/example-id: active/v1beta1/activeprivatelink
  labels:
    testing.upbound.io/example-name: aa_database
  name: aa-database
spec:
  forProvider:
    globalDataPersistence: aof-every-1-second
    globalPasswordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    memoryLimitInGb: 1
    name: db
    subscriptionId: ${rediscloud_active_active_subscription.aa_subscription.id}

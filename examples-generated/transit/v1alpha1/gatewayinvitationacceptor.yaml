apiVersion: transit.redis.io/v1alpha1
kind: GatewayInvitationAcceptor
metadata:
  annotations:
    meta.upbound.io/example-id: transit/v1alpha1/gatewayinvitationacceptor
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    action: accept
    subscriptionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tgwInvitationId: ${data.rediscloud_transit_gateway_invitations.example.invitations[0].id}

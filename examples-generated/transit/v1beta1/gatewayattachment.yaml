apiVersion: transit.redis.io/v1beta1
kind: GatewayAttachment
metadata:
  annotations:
    meta.upbound.io/example-id: transit/v1beta1/gatewayattachment
  labels:
    testing.upbound.io/example-name: attachment
  name: attachment
spec:
  forProvider:
    subscriptionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tgwId: ${data.rediscloud_transit_gateway.gateway.tgw_id}

---

apiVersion: transit.redis.io/v1beta1
kind: GatewayRoute
metadata:
  annotations:
    meta.upbound.io/example-id: transit/v1beta1/gatewayattachment
  labels:
    testing.upbound.io/example-name: route
  name: route
spec:
  forProvider:
    cidrs:
    - 10.10.20.0/24
    subscriptionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    tgwId: ${data.rediscloud_transit_gateway.gateway.tgw_id}

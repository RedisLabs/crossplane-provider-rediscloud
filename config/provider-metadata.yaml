                    }
        argumentDocs:
            cidrs: '- (Required) A list of consumer CIDR blocks'
            region_id: '- (Required) The ID of the AWS region'
            subscription_id: '- (Required) The ID of the Active-Active subscription'
            tgw_id: '- (Required) The ID of the Transit Gateway'

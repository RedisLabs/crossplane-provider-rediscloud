    rediscloud_transit_gateway_route:
        subCategory: ""
        description: Transit Gateway Route resource in the Redis Cloud Terraform provider.
        name: rediscloud_transit_gateway_route
        title: rediscloud_transit_gateway_route
        examples:
            - name: example
              manifest: |-
                {
                  "cidrs": [
                    "10.10.20.0/24",
                    "10.10.30.0/24"
                  ],
                  "depends_on": [
                    "${aws_ec2_transit_gateway_vpc_attachment_accepter.example}"
                  ],
                  "subscription_id": "${rediscloud_subscription.example.id}",
                  "tgw_id": "${data.rediscloud_transit_gateway.example.tgw_id}"
                }
              references:
                subscription_id: rediscloud_subscription.example.id
                tgw_id: data.rediscloud_transit_gateway.example.tgw_id
              dependencies:
                aws_ec2_transit_gateway_vpc_attachment_accepter.example: |-
                    {
                      "transit_gateway_attachment_id": "${rediscloud_transit_gateway_attachment.example.attachment_uid}"
                    }
                rediscloud_transit_gateway_attachment.example: |-
                    {
                      "subscription_id": "${rediscloud_subscription.example.id}",
                      "tgw_id": "${data.rediscloud_transit_gateway.example.tgw_id}"
                    }
                rediscloud_transit_gateway_invitation_acceptor.example: |-
                    {
                      "action": "accept",
                      "subscription_id": "${rediscloud_subscription.example.id}",
                      "tgw_invitation_id": "${data.rediscloud_transit_gateway_invitations.example.invitations[0].id}"
                    }
        argumentDocs:
            cidrs: '- (Required) A list of consumer CIDR blocks'
            subscription_id: '- (Required) The ID of the Pro subscription'
            tgw_id: '- (Required) The ID of the Transit Gateway'
        importStatements: []

apiVersion: cloud.redis.io/v1beta1
kind: Account
metadata:
  name: example-cloud-account
spec:
  forProvider:
    accessKeyId: example-access-key-id
    accessSecretKeySecretRef:
      name: aws-credentials
      namespace: default
      key: secret-access-key
    consoleUsername: example-console-user
    consolePasswordSecretRef:
      name: aws-credentials
      namespace: default
      key: console-password
    name: my-aws-account
    providerType: AWS
    signInLoginUrl: https://console.aws.amazon.com
  providerConfigRef:
    name: default

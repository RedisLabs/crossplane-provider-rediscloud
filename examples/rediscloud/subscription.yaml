apiVersion: rediscloud.redis.io/v1beta1
kind: Subscription
metadata:
  name: example-subscription
spec:
  forProvider:
    name: "my-redis-subscription"
    memoryStorage: "ram"
    # Placeholder. Replace it with the account payment method id.
    # The real id stays out of git. The QA script reads it from the PaymentMethod lookup.
    paymentMethodId: "example-payment-method-id"
    cloudProvider:
    - provider: "AWS"
      region:
      - region: "us-east-1"
        networkingDeploymentCidr: "10.0.0.0/24"
        multipleAvailabilityZones: true
    creationPlan:
    - quantity: 1
      replication: true
      datasetSizeInGb: 1
      throughputMeasurementBy: "operations-per-second"
      throughputMeasurementValue: 1000
  providerConfigRef:
    name: default

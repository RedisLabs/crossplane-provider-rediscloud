apiVersion: subscription.redis.io/v1beta1
kind: Database
metadata:
  name: example-database
spec:
  forProvider:
    # subscriptionId is a number in Terraform. A name reference cannot fill it.
    # Copy the subscription's status.atProvider.id here after it exists.
    subscriptionId: 123456
    name: my-redis-database
    protocol: redis
    memoryLimitInGb: 1
    dataPersistence: aof-every-1-second
    throughputMeasurementBy: operations-per-second
    throughputMeasurementValue: 10000
    replication: true
    modules:
      - name: RedisJSON
      - name: RedisSearch
    alert:
      - name: connections-limit
        value: 80
      - name: dataset-size
        value: 80
  providerConfigRef:
    name: default

      - name: Install pinned Terraform and provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-plan/bin" "$RUNNER_TEMP/qa-plan/plugins/registry.terraform.io/redislabs/rediscloud/2.20.0/linux_amd64"
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o "$RUNNER_TEMP/qa-plan/terraform.zip"
          echo 'c0ed7bc32ee52ae255af9982c8c88a7a4c610485cf1d55feeb037eab75fa082c  '"$RUNNER_TEMP/qa-plan/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/qa-plan/terraform.zip" -d "$RUNNER_TEMP/qa-plan/bin"
          curl -fsSL https://github.com/RedisLabs/terraform-provider-rediscloud/releases/download/v2.20.0/terraform-provider-rediscloud_2.20.0_linux_amd64.zip -o "$RUNNER_TEMP/qa-plan/provider.zip"
          echo 'a8642d27a521ebac0a08392bc2cce35b53d8e6a3a6e8b37a3895d83ad2e2c998  '"$RUNNER_TEMP/qa-plan/provider.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/qa-plan/provider.zip" 'terraform-provider-rediscloud_v2.20.0' -d "$RUNNER_TEMP/qa-plan/plugins/registry.terraform.io/redislabs/rediscloud/2.20.0/linux_amd64"
      - name: Exercise simulated combined managed Pro lifecycle
        run: |
          export QA_TEST_TERRAFORM="$RUNNER_TEMP/qa-plan/bin/terraform"
          export QA_TEST_PROVIDER_DIR="$RUNNER_TEMP/qa-plan/plugins"
          go test ./scripts/qa_tfplan -run '^TestProCombinedManagedLifecycleLoopback$' -count=1 -v

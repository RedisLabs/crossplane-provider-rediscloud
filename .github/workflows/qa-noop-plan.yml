          curl -fsSL https://github.com/RedisLabs/terraform-provider-rediscloud/releases/download/v2.20.0/terraform-provider-rediscloud_2.20.0_linux_amd64.zip -o "$RUNNER_TEMP/qa-plan/provider.zip"
          echo 'a8642d27a521ebac0a08392bc2cce35b53d8e6a3a6e8b37a3895d83ad2e2c998  '"$RUNNER_TEMP/qa-plan/provider.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/qa-plan/provider.zip" 'terraform-provider-rediscloud_v2.20.0' -d "$RUNNER_TEMP/qa-plan/plugins/registry.terraform.io/redislabs/rediscloud/2.20.0/linux_amd64"
      - name: Install pinned API server and etcd
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/envtest.tgz" https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.36.2/envtest-v1.36.2-linux-amd64.tar.gz
          echo '5e99f4eef3d6f9d4dd063730299f708c98da8801f2f14d8fc762cb354f30c332  '"$RUNNER_TEMP/envtest.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/envtest"
          tar -xzf "$RUNNER_TEMP/envtest.tgz" --strip-components=2 -C "$RUNNER_TEMP/envtest" controller-tools/envtest/etcd controller-tools/envtest/kube-apiserver
      - name: Exercise product Pro delete hold
        run: |
          export KUBEBUILDER_ASSETS="$RUNNER_TEMP/envtest"
          export QA_TEST_TERRAFORM="$RUNNER_TEMP/qa-plan/bin/terraform"
          export QA_TEST_PROVIDER_DIR="$RUNNER_TEMP/qa-plan/plugins"
          python3 acceptance/go_test_receipts.py ./scripts/qa_tfplan TestProductProDeleteHold TestProductProDeleteHold/default_off TestProductProDeleteHold/success TestProductProDeleteHold/accepted_503 TestProductProHoldConcurrentReservation TestProductProHoldPolicyBoundaries TestProductProHoldPolicyBoundaries/orphan TestProductProHoldPolicyBoundaries/no_delete TestProductProHoldPolicyBoundaries/nil_before_dispatch

name: Track Terraform provider release

on:
  schedule:
    # Daily poll. Release events exist only for this repository, not for the
    # upstream Terraform provider.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Fixture release tag, such as v2.20.0. Empty uses the latest GitHub release."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Print the decision and do not open a pull request."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: terraform-release-track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: "1.24"

      - name: Track release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
          TRACK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/track_terraform_release.py

name: Nightly QA

# This workflow is not a required check. It runs on main after merge.
# 06:17 UTC is two hours after terraform-release.yaml at 04:17 UTC.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: QA suite to run
        type: choice
        options:
          - standard
          - strict-essentials
          - preflight
        default: standard

permissions:
  contents: read

concurrency:
  group: qa-live
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"

jobs:
  preflight:
    if: inputs.suite == 'preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Verify QA endpoint and read-only plans
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
        run: python3 scripts/qa_live.py --preflight-only

  qa-live:
    if: inputs.suite != 'preflight'
    runs-on: ubuntu-24.04
    # Leave time for a bounded recovery after a qualification failure.
    timeout-minutes: 240
    steps:
      - name: Refuse disabled live qualification before Kind
        if: inputs.suite == 'strict-essentials'
        run: |
          echo 'Strict qualification is disabled until runner-loss recovery is durable.'
          exit 1

      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          submodules: true

      # This intent is uploaded before any Cloud write. The disabling step
      # above remains until recovery and account serialization are reviewed.
      - name: Create encrypted ownership intent
        if: inputs.suite == 'strict-essentials'
        env:
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
        run: node scripts/qa_checkpoint.mjs create "$RUNNER_TEMP/ownership.enc"

      - name: Persist ownership intent before Cloud writes
        if: inputs.suite == 'strict-essentials'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownership.enc
          if-no-files-found: error
          retention-days: 90

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Deploy the provider to kind
        run: make local-deploy

      - name: Create and delete the QA objects
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          QA_SUITE: ${{ inputs.suite || 'standard' }}
        run: |
          tool=$(ls .cache/tools/*/kubectl-* | head -n 1)
          if [ "$QA_SUITE" = strict-essentials ]; then
            python3 scripts/qa_live.py --kubectl "$tool" --strict-essentials --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python3 scripts/qa_live.py --kubectl "$tool"
          fi

      - name: Delete a leftover xp-ci subscription
        if: always() && (inputs.suite != 'strict-essentials')
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
        run: |
          tool=$(ls .cache/tools/*/kubectl-* | head -n 1)
          python3 scripts/qa_live.py --kubectl "$tool" --cleanup-only

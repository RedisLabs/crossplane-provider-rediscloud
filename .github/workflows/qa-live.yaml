name: Nightly QA

# This workflow is not a required check. It runs on main after merge.
# 06:17 UTC is two hours after terraform-release.yaml at 04:17 UTC.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: QA suite to run
        type: choice
        options:
          - standard
          - strict-essentials
          - preflight
          - task-diagnostic
          - checkpoint-rehearsal
          - checkpoint-writer-rehearsal
          - recovery-rehearsal
          - recovery-rehearsal-mutate
        default: standard
      source_run_id:
        description: Completed checkpoint rehearsal run ID (recovery rehearsals only)
        required: false
        type: string
      source_attempt:
        description: Checkpoint rehearsal attempt number
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qa-live
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"

jobs:
  task-diagnostic:
    if: inputs.suite == 'task-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Inspect recent database delete task states
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          QA_ACCOUNT_FINGERPRINT_KEY: ${{ secrets.QA_ACCOUNT_FINGERPRINT_KEY }}
        run: python3 scripts/qa_live.py --task-diagnostic

  recovery-rehearsal-mutate:
    if: inputs.suite == 'recovery-rehearsal-mutate'
    uses: ./.github/workflows/qa-recover.yaml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_attempt: ${{ inputs.source_attempt }}
      recovery_mode: recover-exact
      rehearsal_only: true
    secrets: inherit

  recovery-rehearsal:
    if: inputs.suite == 'recovery-rehearsal'
    uses: ./.github/workflows/qa-recover.yaml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_attempt: ${{ inputs.source_attempt }}
    secrets: inherit

  checkpoint-rehearsal:
    if: inputs.suite == 'checkpoint-rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Create encrypted rehearsal intent
        env:
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
          QA_CHECKPOINT_KIND: rehearsal
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
        run: python3 scripts/qa_capture_task_baseline.py | node scripts/qa_checkpoint.mjs create "$RUNNER_TEMP/ownership.enc"
      - name: Persist rehearsal intent
        id: rehearsal-artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownership.enc
          if-no-files-found: error
          retention-days: 1
      - name: Simulate loss after persisted intent
        run: |
          echo 'Intentional rehearsal failure after artifact upload; no Cloud writes occurred.'
          exit 97

  verify-rehearsal:
    needs: checkpoint-rehearsal
    if: always() && inputs.suite == 'checkpoint-rehearsal' && needs.checkpoint-rehearsal.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Retrieve encrypted intent from terminated job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-recovery
      - name: Authenticate recovered rehearsal intent
        env:
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
        run: |
          node scripts/qa_checkpoint.mjs resolve "$RUNNER_TEMP/qa-recovery/ownership.enc" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          python3 -c 'import json,os,sys; p=os.environ["RUNNER_TEMP"]+"/qa-recovery/ownership.enc.resolved"; sys.exit(0 if json.load(open(p))["kind"]=="rehearsal" else 1)'

  preflight:
    if: inputs.suite == 'preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Verify QA endpoint and read-only plans
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
        run: python3 scripts/qa_live.py --preflight-only

  prepare-strict:
    if: inputs.suite == 'strict-essentials' || inputs.suite == 'checkpoint-writer-rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.ownership.outputs.artifact-id }}
    steps:
      - name: Defer strict live writes until shared-account serialization exists
        if: inputs.suite == 'strict-essentials'
        run: |
          echo 'DEFER: shared QA account has no cross-repository writer lock; no live test was run.'
          exit 1
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Create encrypted ownership intent
        env:
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
          QA_CHECKPOINT_KIND: ${{ inputs.suite == 'strict-essentials' && 'strict' || 'rehearsal' }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
        run: python3 scripts/qa_capture_task_baseline.py | node scripts/qa_checkpoint.mjs create "$RUNNER_TEMP/ownership.enc"
      - name: Persist ownership intent before Cloud writes
        id: ownership
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownership.enc
          if-no-files-found: error
          retention-days: 90

  verify-writer-rehearsal:
    needs: prepare-strict
    if: inputs.suite == 'checkpoint-writer-rehearsal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Retrieve ownership intent from completed producer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-strict.outputs.artifact-id }}
          path: ${{ runner.temp }}/verified-ownership
          merge-multiple: true
      - name: Verify persisted artifact identity
        env:
          QA_OWNERSHIP_ARTIFACT_ID: ${{ needs.prepare-strict.outputs.artifact-id }}
          QA_OWNERSHIP_ARTIFACT_PATH: ${{ runner.temp }}/verified-ownership/ownership.enc
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); import qa_live; c=qa_live.load_credentials(None,os.environ.get("UPTEST_CLOUD_CREDENTIALS")); qa_live.verify_checkpoint_artifact(os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"],c,"rehearsal"); print("ownership artifact verified for this run and commit")'

  qa-live:
    needs: prepare-strict
    if: ${{ !cancelled() && (inputs.suite == '' || inputs.suite == 'standard' || (inputs.suite == 'strict-essentials' && needs.prepare-strict.result == 'success')) }}
    runs-on: ubuntu-24.04
    # Leave time for a bounded recovery after a qualification failure.
    timeout-minutes: 240
    steps:
      - name: Defer live writes until shared-account serialization exists
        if: github.event_name == 'schedule' || inputs.suite == 'standard' || inputs.suite == '' || inputs.suite == 'strict-essentials'
        run: |
          echo 'DEFER: shared QA account has no cross-repository writer lock; no live test was run.'
          exit 1
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          submodules: true

      - name: Retrieve persisted ownership intent before Cloud writes
        if: inputs.suite == 'strict-essentials'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-strict.outputs.artifact-id }}
          path: ${{ runner.temp }}/verified-ownership
          merge-multiple: true

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Deploy the provider to kind
        run: make local-deploy

      - name: Create and delete the QA objects
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          QA_SUITE: ${{ inputs.suite || 'standard' }}
          QA_OWNERSHIP_ARTIFACT_ID: ${{ needs.prepare-strict.outputs.artifact-id }}
          QA_OWNERSHIP_ARTIFACT_PATH: ${{ runner.temp }}/verified-ownership/ownership.enc
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
        run: |
          tool=$(ls .cache/tools/*/kubectl-* | head -n 1)
          if [ "$QA_SUITE" = strict-essentials ]; then
            python3 scripts/qa_live.py --kubectl "$tool" --strict-essentials --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python3 scripts/qa_live.py --kubectl "$tool"
          fi

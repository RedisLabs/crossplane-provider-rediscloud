name: Credential-free alpha OCI installation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oci-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact integrated source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: f2e4bbc86495d31eb2bed76ebe4124622150c80a
          submodules: true
          fetch-depth: 0
      - name: Verify fixed source and PR base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f2e4bbc86495d31eb2bed76ebe4124622150c80a
          test -z "$(git status --porcelain)"
          if [ -n "$PR_BASE_SHA" ]; then test "$PR_BASE_SHA" = e8ed94c75e0dfa0e6e965df46c6899bd6c04bb6c; fi
          echo "Integrated source: $(git rev-parse HEAD)"
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.26.11'
      - name: Build package and start isolated hosted Kind
        run: |
          set -euo pipefail
          make vendor vendor.check
          make build
          make .cache/tools/linux_x86_64/kind-v0.33.0
          printf 'kind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnetworking:\n  ipFamily: dual\n' > "$RUNNER_TEMP/dual-kind.yaml"
          .cache/tools/linux_x86_64/kind-v0.33.0 create cluster --name local-dev --config "$RUNNER_TEMP/dual-kind.yaml"
          make controlplane.up
      - name: Pull immutable package digest from ephemeral registry
        shell: bash
        run: |
          set -euo pipefail
          kubectl=.cache/tools/linux_x86_64/kubectl-v1.33.5
          kind=.cache/tools/linux_x86_64/kind-v0.33.0
          crossplane=.cache/tools/linux_x86_64/crossplane-cli-v2.4.1
          "$kubectl" -n upbound-system rollout status deployment/crossplane --timeout=5m
          "$kubectl" -n upbound-system patch deployment crossplane --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/-","value":{"name":"ephemeral-registry","image":"registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373","env":[{"name":"REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY","value":"/tmp/registry"}],"readinessProbe":{"tcpSocket":{"port":5000},"periodSeconds":2}}},{"op":"add","path":"/spec/template/spec/hostAliases","value":[{"ip":"127.0.0.1","hostnames":["registry.localhost"]}]}]'
          "$kubectl" -n upbound-system rollout status deployment/crossplane --timeout=5m
          pod=$("$kubectl" -n upbound-system get pods -l app=crossplane -o json | python3 -c '
          import json, sys
          pods = json.load(sys.stdin)["items"]
          ready = [p["metadata"]["name"] for p in pods if not p["metadata"].get("deletionTimestamp") and p.get("status", {}).get("phase") == "Running" and any(c["name"] == "ephemeral-registry" and c.get("ready") for c in p["status"].get("containerStatuses", []))]
          if len(ready) != 1:
              raise SystemExit("expected exactly one running registry-ready Crossplane pod")
          print(ready[0])
          ')
          pod_ip=$("$kubectl" -n upbound-system get pod "$pod" -o jsonpath='{.status.podIP}')
          test -n "$pod_ip"
          "$kubectl" -n upbound-system port-forward "pod/$pod" 5001:5000 >"$RUNNER_TEMP/registry-forward.log" 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://localhost:5001/v2/ >/dev/null 2>&1; then break; fi
            if ! kill -0 "$forward" 2>/dev/null; then
              cat "$RUNNER_TEMP/registry-forward.log"
              "$kubectl" -n upbound-system logs "$pod" -c ephemeral-registry --tail=40 || true
              exit 1
            fi
            sleep 1
          done
          if ! curl -fsS --max-time 3 http://localhost:5001/v2/ >/dev/null; then
            cat "$RUNNER_TEMP/registry-forward.log"
            "$kubectl" -n upbound-system logs "$pod" -c ephemeral-registry --tail=40 || true
            exit 1
          fi
          mapfile -t packages < <(find _output/xpkg/linux_amd64 -maxdepth 1 -type f -name '*.xpkg' -print)
          test "${#packages[@]}" -eq 1
          sha256sum "${packages[0]}"
          "$crossplane" xpkg push -f "${packages[0]}" localhost:5001/provider-rediscloud:v0.0.1
          digest=$(curl -fsSI -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' http://localhost:5001/v2/provider-rediscloud/manifests/v0.0.1 | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" {print $2}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          curl -fsS -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' "http://localhost:5001/v2/provider-rediscloud/manifests/$digest" -o "$RUNNER_TEMP/oci-manifest.json"
          echo "${digest#sha256:}  $RUNNER_TEMP/oci-manifest.json" | sha256sum -c -
          wrong="0${digest:8}"
          if [[ "$wrong" == "${digest#sha256:}" ]]; then wrong="1${digest:8}"; fi
          if echo "$wrong  $RUNNER_TEMP/oci-manifest.json" | sha256sum -c --status; then
            echo "Corrupt manifest digest unexpectedly passed" >&2
            exit 1
          fi
          echo "Ephemeral registry OCI package digest: $digest"
          python3 - "$RUNNER_TEMP/oci-manifest.json" "${packages[0]}" <<'PY'
          import hashlib, io, json, re, sys, tarfile

          def verify(manifest, archive):
              descriptors = [manifest["config"], *manifest["layers"]]
              expected = {}
              for index, descriptor in enumerate(descriptors):
                  digest = descriptor["digest"]
                  size = descriptor["size"]
                  if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest) or type(size) is not int or size < 0:
                      raise ValueError("invalid manifest descriptor")
                  name = digest if index == 0 else digest[7:] + ".tar.gz"
                  if name in expected:
                      raise ValueError("duplicate manifest descriptor")
                  expected[name] = (digest[7:], size)
              seen = set()
              with tarfile.open(fileobj=archive, mode="r:*") as tar:
                  for member in tar:
                      if member.name == "manifest.json" and member.isfile():
                          continue
                      if not member.isfile() or member.name not in expected or member.name in seen:
                          raise ValueError("unexpected or duplicate xpkg blob")
                      expected_hash, expected_size = expected[member.name]
                      if member.size != expected_size:
                          raise ValueError("xpkg blob size differs from manifest")
                      content = tar.extractfile(member)
                      if content is None:
                          raise ValueError("xpkg blob unreadable")
                      digest = hashlib.sha256()
                      for chunk in iter(lambda: content.read(1024 * 1024), b""):
                          digest.update(chunk)
                      if digest.hexdigest() != expected_hash:
                          raise ValueError("xpkg blob hash differs from manifest")
                      seen.add(member.name)
              if seen != set(expected):
                  raise ValueError("xpkg is missing a manifest blob")

          # Synthetic corruption and missing-layer cases must both fail closed.
          config, layer = b"config", b"layer"
          config_hash = hashlib.sha256(config).hexdigest()
          layer_hash = hashlib.sha256(layer).hexdigest()
          sample = {"config": {"digest": "sha256:" + config_hash, "size": len(config)}, "layers": [{"digest": "sha256:" + layer_hash, "size": len(layer)}]}
          def fixture(layer_bytes):
              buf = io.BytesIO()
              with tarfile.open(fileobj=buf, mode="w") as tar:
                  for name, data in [("sha256:" + config_hash, config), (layer_hash + ".tar.gz", layer_bytes)]:
                      if data is None:
                          continue
                      info = tarfile.TarInfo(name)
                      info.size = len(data)
                      tar.addfile(info, io.BytesIO(data))
              buf.seek(0)
              return buf
          verify(sample, fixture(layer))
          for corrupt in (fixture(b"wrong"), fixture(None)):
              try:
                  verify(sample, corrupt)
              except ValueError:
                  pass
              else:
                  raise SystemExit("corrupt or missing blob unexpectedly accepted")
          with open(sys.argv[1], encoding="utf-8") as f:
              manifest = json.load(f)
          with open(sys.argv[2], "rb") as f:
              verify(manifest, f)
          print("Every OCI config and layer digest and size matches the locally built xpkg.")
          PY
          for node in $("$kind" get nodes --name local-dev); do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/registry.localhost:5000
            printf '[host."http://%s:5000"]\n' "$pod_ip" | docker exec -i "$node" tee /etc/containerd/certs.d/registry.localhost:5000/hosts.toml >/dev/null
          done
          printf '{"apiVersion":"pkg.crossplane.io/v1","kind":"Provider","metadata":{"name":"provider-rediscloud"},"spec":{"package":"registry.localhost:5000/provider-rediscloud@%s","packagePullPolicy":"Always"}}\n' "$digest" | "$kubectl" apply -f -
          if ! "$kubectl" wait provider.pkg.crossplane.io/provider-rediscloud --for=condition=Healthy --timeout=8m; then
            "$kubectl" describe provider.pkg.crossplane.io/provider-rediscloud || true
            "$kubectl" get providerrevisions.pkg.crossplane.io -o wide || true
            "$kubectl" -n upbound-system get pods -o wide || true
            exit 1
          fi
          "$kubectl" -n upbound-system wait deployments --all --for=condition=Available --timeout=8m
          for crd in providerconfigs.rediscloud.redis.io subscriptions.rediscloud.redis.io databases.subscription.redis.io roles.acl.redis.io rules.acl.redis.io users.acl.redis.io links.private.redis.io serviceconnects.private.redis.io serviceconnectendpoints.private.redis.io regions.lookup.redis.io paymentmethods.lookup.redis.io; do
            "$kubectl" wait "crd/$crd" --for=condition=Established --timeout=2m
          done
          export REGISTRY_DIGEST="$digest"
          "$kubectl" -n upbound-system get pods -o json | python3 -c '
          import json, os, pathlib, re, sys
          pods = json.load(sys.stdin)["items"]
          matches = [(p, c) for p in pods if p["metadata"]["name"].startswith("provider-rediscloud-") for c in p.get("status", {}).get("containerStatuses", []) if c["name"] == "package-runtime"]
          if len(matches) != 1 or not matches[0][1].get("ready") or not re.search(r"@sha256:[0-9a-f]{64}$", matches[0][1].get("imageID", "")):
              raise SystemExit("expected one ready provider runtime with immutable image ID")
          def digest_matches(image_id, digest):
              return image_id.rsplit("@", 1)[-1] == digest
          if digest_matches("registry.localhost:5000/example@sha256:" + "0"*64, "sha256:" + "1"*64):
              raise SystemExit("wrong runtime digest unexpectedly accepted")
          if not digest_matches(matches[0][1]["imageID"], os.environ["REGISTRY_DIGEST"]):
              raise SystemExit("running image ID does not match installed package digest")
          pathlib.Path(os.environ["RUNNER_TEMP"], "provider-pod.txt").write_text(matches[0][0]["metadata"]["name"])
          print("Provider runtime image ID matches installed OCI digest:", matches[0][1]["imageID"])
          '
          runtime_pod=$(cat "$RUNNER_TEMP/provider-pod.txt")
          "$kubectl" -n upbound-system cp -c package-runtime "$runtime_pod:/usr/local/bin/provider" "$RUNNER_TEMP/running-provider"
          cmp _output/bin/linux_amd64/provider "$RUNNER_TEMP/running-provider"
          echo "Provider binary in running pod matches the binary built from the pinned source."
      - name: Verify actual provider has dual-stack addresses
        shell: bash
        run: |
          set -euo pipefail
          kubectl=.cache/tools/linux_x86_64/kubectl-v1.33.5
          runtime_pod=$(cat "$RUNNER_TEMP/provider-pod.txt")
          "$kubectl" -n upbound-system get pod "$runtime_pod" -o json | python3 -c '
          import ipaddress, json, sys
          pod = json.load(sys.stdin)
          addresses = [ipaddress.ip_address(item["ip"]) for item in pod.get("status", {}).get("podIPs", [])]
          if {address.version for address in addresses} != {4, 6}:
              raise SystemExit("installed provider pod does not have IPv4 and IPv6 addresses")
          if pod["spec"].get("hostNetwork", False):
              raise SystemExit("provider pod unexpectedly uses host networking")
          print("Installed provider pod has IPv4 and IPv6 addresses; no egress containment claim.")
          '
      - name: Probe installed-provider node relay and API permissions (partial proof)
        shell: bash
        run: |
          set -euo pipefail
          kubectl=.cache/tools/linux_x86_64/kubectl-v1.33.5
          runtime_pod=$(cat "$RUNNER_TEMP/provider-pod.txt")
          "$kubectl" -n upbound-system get pod "$runtime_pod" -o json > "$RUNNER_TEMP/provider-identity.json"
          python3 - "$RUNNER_TEMP/provider-identity.json" "$RUNNER_TEMP/provider-identity.env" <<'PYTHON'
          import ipaddress, json, pathlib, re, sys
          pod = json.loads(pathlib.Path(sys.argv[1]).read_text())
          spec, metadata, status = pod["spec"], pod["metadata"], pod["status"]
          if spec.get("hostNetwork", False) or status.get("phase") != "Running":
              raise SystemExit("provider must be a running non-host-network pod")
          ip = str(ipaddress.IPv4Address(status["podIP"]))
          v6 = [str(ipaddress.IPv6Address(item["ip"])) for item in status.get("podIPs", []) if ipaddress.ip_address(item["ip"]).version == 6]
          if len(v6) != 1:
              raise SystemExit("expected exactly one provider IPv6 address")
          fields = {"POD_UID": metadata["uid"], "POD_IP": ip, "POD_IP6": v6[0], "NODE": spec["nodeName"], "SA": spec["serviceAccountName"]}
          if any(not re.fullmatch(r"[a-zA-Z0-9.:-]+", value) for value in fields.values()):
              raise SystemExit("invalid provider identity")
          pathlib.Path(sys.argv[2]).write_text("".join(f"{key}={value}\n" for key, value in fields.items()))
          PYTHON
          source "$RUNNER_TEMP/provider-identity.env"
          test "$NODE" = local-dev-control-plane
          node_ip=$("$kubectl" get node "$NODE" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          python3 - "$node_ip" <<'PYTHON'
          import ipaddress, sys
          ipaddress.IPv4Address(sys.argv[1])
          PYTHON
          node_ip6=$(docker exec "$NODE" ip -j -6 address show dev eth0 | python3 -c 'import ipaddress,json,sys; addresses=[a["local"] for interface in json.load(sys.stdin) for a in interface.get("addr_info", []) if a.get("scope") == "global" and ipaddress.ip_address(a["local"]).version == 6]; assert len(addresses)==1; print(addresses[0])')
          image='registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373'
          docker run -d --rm --name node-relay-fixture --network "container:$NODE" -e 'REGISTRY_HTTP_ADDR=[::]:5555' "$image" >/dev/null
          cleanup() {
            docker exec "$NODE" iptables -D INPUT -s "$POD_IP/32" -p tcp --dport 5555 -m comment --comment codex-provider-node-probe -j REJECT 2>/dev/null || true
            docker exec "$NODE" ip6tables -D INPUT -s "$POD_IP6/128" -p tcp --dport 5555 -m comment --comment codex-provider-node-probe-v6 -j REJECT 2>/dev/null || true
            docker stop node-relay-fixture >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if docker run --rm --network "container:$NODE" --entrypoint wget "$image" -q -T 2 -O /dev/null http://127.0.0.1:5555/v2/; then break; fi
            sleep 1
          done
          docker run --rm --network "container:$NODE" --entrypoint wget "$image" -q -T 2 -O /dev/null http://127.0.0.1:5555/v2/
          "$kubectl" -n upbound-system debug "pod/$runtime_pod" --container=node-probe --image="$image" --attach=false -- /bin/sh -c 'sleep 1200'
          for attempt in $(seq 1 60); do
            if "$kubectl" -n upbound-system get pod "$runtime_pod" -o jsonpath='{.status.ephemeralContainerStatuses[?(@.name=="node-probe")].state.running.startedAt}' | grep -q .; then break; fi
            sleep 1
          done
          test "$("$kubectl" -n upbound-system get pod "$runtime_pod" -o jsonpath='{.metadata.uid}')" = "$POD_UID"
          "$kubectl" -n upbound-system exec "$runtime_pod" -c node-probe -- wget -q -T 3 -O /dev/null "http://$node_ip:5555/v2/"
          echo "Provider pod network can reach the independently verified node listener before firewalling."
          docker exec "$NODE" iptables -I INPUT 1 -s "$POD_IP/32" -p tcp --dport 5555 -m comment --comment codex-provider-node-probe -j REJECT
          mapfile -t before < <(docker exec "$NODE" iptables -nvx -L INPUT | awk '/codex-provider-node-probe/ {print $1}')
          test "${#before[@]}" -eq 1 && [[ "${before[0]}" =~ ^[0-9]+$ ]]
          "$kubectl" -n upbound-system exec "$runtime_pod" -c node-probe -- /bin/sh -c 'if wget -q -T 3 -O /dev/null "http://$1:5555/v2/"; then exit 42; else exit 0; fi' -- "$node_ip"
          mapfile -t after < <(docker exec "$NODE" iptables -nvx -L INPUT | awk '/codex-provider-node-probe/ {print $1}')
          test "${#after[@]}" -eq 1 && [[ "${after[0]}" =~ ^[0-9]+$ ]] && (( after[0] > before[0] ))
          docker run --rm --network "container:$NODE" --entrypoint wget "$image" -q -T 2 -O /dev/null http://127.0.0.1:5555/v2/
          test "$("$kubectl" -n upbound-system get pod "$runtime_pod" -o jsonpath='{.metadata.uid}')" = "$POD_UID"
          echo "One IPv4 node-listener port was blocked; this is not a full egress boundary."
          "$kubectl" -n upbound-system exec "$runtime_pod" -c node-probe -- wget -q -T 3 -O /dev/null "http://[$node_ip6]:5555/v2/"
          docker exec "$NODE" ip6tables -I INPUT 1 -s "$POD_IP6/128" -p tcp --dport 5555 -m comment --comment codex-provider-node-probe-v6 -j REJECT
          mapfile -t before6 < <(docker exec "$NODE" ip6tables -nvx -L INPUT | awk '/codex-provider-node-probe-v6/ {print $1}')
          test "${#before6[@]}" -eq 1 && [[ "${before6[0]}" =~ ^[0-9]+$ ]]
          "$kubectl" -n upbound-system exec "$runtime_pod" -c node-probe -- /bin/sh -c 'if wget -q -T 3 -O /dev/null "http://[$1]:5555/v2/"; then exit 42; else exit 0; fi' -- "$node_ip6"
          mapfile -t after6 < <(docker exec "$NODE" ip6tables -nvx -L INPUT | awk '/codex-provider-node-probe-v6/ {print $1}')
          test "${#after6[@]}" -eq 1 && [[ "${after6[0]}" =~ ^[0-9]+$ ]] && (( after6[0] > before6[0] ))
          docker run --rm --network "container:$NODE" --entrypoint wget "$image" -q -T 2 -O /dev/null 'http://[::1]:5555/v2/'
          test "$("$kubectl" -n upbound-system get pod "$runtime_pod" -o jsonpath='{.metadata.uid}')" = "$POD_UID"
          echo "One IPv6 node-listener port was blocked; this is not a full egress boundary."
          for rule in 'create pods' 'create pods/exec' 'create pods/portforward' 'get pods/proxy' 'get services/proxy' 'create networkpolicies.networking.k8s.io'; do
            read -r verb resource <<< "$rule"
            set +e
            answer=$("$kubectl" auth can-i "$verb" "$resource" --as="system:serviceaccount:upbound-system:$SA" --all-namespaces 2>"$RUNNER_TEMP/auth-error")
            auth_rc=$?
            set -e
            if [ -s "$RUNNER_TEMP/auth-error" ]; then echo "API permission check failed" >&2; exit 1; fi
            if [ "$answer" = yes ] && [ "$auth_rc" -eq 0 ]; then
              echo "Potential API relay/policy permission allowed: $rule"
            elif [ "$answer" = no ] && [ "$auth_rc" -eq 1 ]; then
              echo "API relay/policy permission denied: $rule"
            else
              echo "Unexpected API permission check outcome" >&2; exit 1
            fi
          done
          echo "Partial credential-free observation only. Do not enable live QA until full egress, startup/replacement, IPv6 and RBAC boundaries are proven."
      - name: Preserve package and OCI manifest
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: alpha-oci-evidence-f2e4bbc
          path: |
            _output/xpkg/linux_amd64/*.xpkg
            ${{ runner.temp }}/oci-manifest.json
          if-no-files-found: error

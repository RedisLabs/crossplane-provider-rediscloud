name: Credential-free alpha package install proof
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact integrated source
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: f2e4bbc86495d31eb2bed76ebe4124622150c80a
          submodules: true
          fetch-depth: 0
      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f2e4bbc86495d31eb2bed76ebe4124622150c80a
          test -z "$(git status --porcelain)"
          echo "Integrated source: $(git rev-parse HEAD)"
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.26.11'
      - name: Validate dependencies
        run: make vendor vendor.check
      - name: Build package and install on isolated hosted Kind
        run: make local-deploy
      - name: Verify package, readiness, and alpha CRDs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find _output/xpkg/linux_amd64 -maxdepth 1 -type f -name '*.xpkg' -print)
          test "${#packages[@]}" -eq 1
          sha256sum "${packages[0]}"
          kubectl=.cache/tools/linux_amd64/kubectl-v1.33.5
          "$kubectl" wait provider.pkg.crossplane.io/provider-rediscloud --for=condition=Healthy --timeout=5m
          "$kubectl" -n upbound-system wait deployments --all --for=condition=Available --timeout=5m
          "$kubectl" -n upbound-system get pods -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.containerStatuses[*]}{.imageID}{" "}{end}{"\n"}{end}'
          for crd in subscriptions.rediscloud.redis.io databases.subscription.redis.io roles.acl.redis.io rules.acl.redis.io users.acl.redis.io links.private.redis.io serviceconnects.private.redis.io serviceconnectendpoints.private.redis.io regions.lookup.redis.io paymentmethods.lookup.redis.io; do
            "$kubectl" wait "crd/$crd" --for=condition=Established --timeout=2m
          done
          echo "Credential-free Kind package smoke completed; development cache installation, no registry pull."
      - name: Preserve exact local xpkg
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4
        with:
          name: alpha-local-xpkg-f2e4bbc
          path: _output/xpkg/linux_amd64/*.xpkg
          if-no-files-found: error

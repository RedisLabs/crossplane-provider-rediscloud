name: Pro lookup generated artifacts
on:
  pull_request:
    paths:
      - 'apis/lookup/**'
      - '.github/workflows/qa-pro-lookup-generate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.26.11'
      - name: Generate lookup API artifacts
        run: go run -tags generate sigs.k8s.io/controller-tools/cmd/controller-gen object:headerFile=hack/boilerplate.go.txt paths=./apis/lookup/v1alpha1 crd:allowDangerousTypes=true,crdVersions=v1 output:artifacts:config=package/crds
      - name: Save generated artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: pro-lookup-generated
          path: |
            apis/lookup/v1alpha1/zz_generated.deepcopy.go
            package/crds/lookup.redis.io_prosubscriptions.yaml
          if-no-files-found: error

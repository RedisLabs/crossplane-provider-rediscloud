# SPDX-License-Identifier: CC0-1.0
name: QA recovery discovery
on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      source_attempt:
        required: true
        type: string
      recovery_mode:
        required: false
        type: string
        default: inspect
      rehearsal_only:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Originating strict QA workflow run ID
        required: true
        type: string
      source_attempt:
        description: Originating workflow attempt number
        required: true
        type: string
      recovery_mode:
        description: Recovery action
        required: true
        type: choice
        options:
          - inspect
          - recover-exact
        default: inspect
permissions:
  contents: read
  actions: read
concurrency:
  group: qa-recovery-${{ inputs.source_run_id }}-${{ inputs.source_attempt }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse direct recovery until replay protection is durable
        if: inputs.recovery_mode == 'recover-exact'
        run: |
          echo 'Direct recovery disabled: an earlier DELETE may have an uncertain outcome. Use read-only inspection and manual investigation.'
          exit 1
      - name: Reject unknown recovery mode
        if: inputs.recovery_mode != 'inspect' && inputs.recovery_mode != 'recover-exact'
        run: |
          echo 'Unknown recovery mode.'
          exit 1
      - name: Validate source identity
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: |
          python3 -c 'import os,re,sys; sys.exit(0 if all(re.fullmatch(r"[1-9][0-9]*", os.environ.get(k,"")) for k in ("SOURCE_RUN_ID","SOURCE_ATTEMPT")) else 1)'
      - name: Checkout recovery code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - name: Retrieve encrypted ownership intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ownership-${{ inputs.source_run_id }}-${{ inputs.source_attempt }}
          path: ${{ runner.temp }}/qa-recovery
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate checkpoint and originating workflow
        env:
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          QA_REHEARSAL_ONLY: ${{ inputs.rehearsal_only || false }}
        run: |
          node scripts/qa_checkpoint.mjs resolve "$RUNNER_TEMP/qa-recovery/ownership.enc" "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT"
          python3 scripts/qa_verify_source.py --enforce-rehearsal "$RUNNER_TEMP/qa-recovery/ownership.enc.resolved"
          python3 scripts/qa_verify_source.py "$RUNNER_TEMP/qa-recovery/ownership.enc.resolved" "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT"
      - name: Discover exact owned resources without mutation
        if: inputs.recovery_mode == 'inspect'
        env:
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
        run: python3 scripts/qa_recovery_resolve.py "$RUNNER_TEMP/qa-recovery/ownership.enc.resolved"

      - name: Recover exact owned resources
        if: inputs.recovery_mode == 'recover-exact'
        env:
          QA_CHECKPOINT_KEY: ${{ secrets.QA_CHECKPOINT_KEY }}
          UPTEST_CLOUD_CREDENTIALS: ${{ secrets.UPTEST_CLOUD_CREDENTIALS }}
          QA_VERIFIED_ORIGIN_HASHES: ${{ secrets.QA_VERIFIED_ORIGIN_HASHES }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: |
          python3 scripts/qa_recovery_resolve.py "$RUNNER_TEMP/qa-recovery/ownership.enc" --recover-exact --source-run-id "$SOURCE_RUN_ID" --source-attempt "$SOURCE_ATTEMPT"
